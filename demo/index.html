<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio button uncheck</title>
<style>
  body { font: 1.1rem/1.6 system-ui, sans-serif; max-width: 48rem; margin: 4rem auto; padding: 0 1.5rem; color: #203047; background: #f6f8fc; }
  fieldset { background: white; border: 1px solid #bac5d5; border-radius: .75rem; padding: 1.5rem; }
  label { display: block; padding: .5rem; cursor: pointer; }
  input { margin-right: .6rem; }
  output { display: block; margin-top: 1.5rem; }
</style>
<h1>Allow a radio button to be unchecked</h1>
<p>Choose One or Two, then click it again or press Space to clear it. Three uses normal radio behavior.</p>
<fieldset data-describe-deselectable-radio="Press Space or click again to deselect this option.">
  <legend>Choose an option</legend>
    <label><input type="radio" name="x" value="One" data-deselectable>One</label>
    <label><input type="radio" name="x" value="Two" deselectable><span>Two</span></label>
  <input type="radio" name="x" value="Three" id="three">
  <label for="three">Three (cannot be unchecked)</label>
</fieldset>
<output aria-live="polite">No option selected.</output>
<script type="module">
  import { enableDeselectableRadio } from '../dist/index.js';
  enableDeselectableRadio();
  // Shows the current selection for native selection and the library-generated deselection event.
  document.querySelector('fieldset').addEventListener('input', () => {
    const selected = document.querySelector('input:checked');
    document.querySelector('output').textContent = selected ? `Selected: ${selected.value}` : 'No option selected.';
  });
</script>
</html>
